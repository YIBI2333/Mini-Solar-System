<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系3D模型 - 自然土星环</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        canvas#gameCanvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas#gameCanvas:active { cursor: grabbing; }
        #infoPanel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 320px;
            backdrop-filter: blur(8px);
            display: none;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #infoPanel h2 { font-size: 22px; margin-bottom: 8px; color: #ffcc00; }
        #infoPanel .close-btn { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; pointer-events: auto; }
        #infoPanel .close-btn:hover { color: #fff; }
        #infoPanel .info-row { font-size: 14px; line-height: 1.8; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 4px 0; }
        #infoPanel .info-row:last-child { border-bottom: none; }
        #infoPanel .info-label { display: inline-block; width: 80px; color: #aaa; }
        #infoPanel .info-value { color: #fff; }
        #speedControl {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
            font-size: 14px;
        }
        #speedControl input[type="range"] { width: 200px; accent-color: #ffcc00; }
        #speedValue { min-width: 40px; text-align: center; font-weight: bold; }
        #loadingScreen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font-size: 20px; z-index: 100; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="infoPanel">
        <button class="close-btn" id="closePanel">&times;</button>
        <h2 id="panelTitle"></h2>
        <div id="panelContent"></div>
    </div>
    <div id="speedControl">
        <span>公转速度</span>
        <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
        <span id="speedValue">1.0x</span>
    </div>
    <div id="loadingScreen">加载 Three.js 中...</div>

    <script>
        /* global THREE —— Three.js 由 CDN 注入为全局变量，声明后静态检查不再报错 */

        // 依次尝试各个 CDN，全部失败则提示
        (function loadThree(cdns) {
            if (cdns.length === 0) {
                document.getElementById('loadingScreen').innerHTML = '❌ Three.js 加载失败，请检查网络。';
                return;
            }
            const s = document.createElement('script');
            s.src = cdns[0];
            s.onload = startGame;
            s.onerror = () => loadThree(cdns.slice(1));
            document.head.appendChild(s);
        })([
            'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
            'https://unpkg.com/three@0.160.0/build/three.min.js'
        ]);

        function startGame() {
            document.getElementById('loadingScreen').style.display = 'none';

            // ==================== 场景初始化 ====================
            const canvas = document.getElementById('gameCanvas');
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // far 需大于星空半径（最远 1200）加最大视距（200），否则远处星点会被裁掉
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(0, 30, 80);
            camera.lookAt(0, 0, 0);

            // ==================== 灯光 ====================
            const sunLight = new THREE.PointLight(0xffffff, 2.5, 300, 0);
            sunLight.position.set(0, 0, 0);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.set(1024, 1024);
            sunLight.shadow.bias = -0.005;
            scene.add(sunLight);
            const ambientLight = new THREE.AmbientLight(0x222233, 0.6);
            scene.add(ambientLight);

            // ==================== 星空背景 ====================
            function createStarField() {
                const starsGeometry = new THREE.BufferGeometry();
                const starsCount = 6000;
                const positions = new Float32Array(starsCount * 3);
                const colors = new Float32Array(starsCount * 3);
                for (let i = 0; i < starsCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = 600 + Math.random() * 600;
                    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i*3+2] = r * Math.cos(phi);
                    const colorChoice = Math.random();
                    if (colorChoice < 0.6) { colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1; }
                    else if (colorChoice < 0.8) { colors[i*3]=0.8; colors[i*3+1]=0.9; colors[i*3+2]=1; }
                    else if (colorChoice < 0.9) { colors[i*3]=1; colors[i*3+1]=0.9; colors[i*3+2]=0.7; }
                    else { colors[i*3]=0.9; colors[i*3+1]=0.7; colors[i*3+2]=0.9; }
                }
                starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const starsMaterial = new THREE.PointsMaterial({ size: 0.8, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
                const stars = new THREE.Points(starsGeometry, starsMaterial);
                scene.add(stars);

                const galaxyGeometry = new THREE.BufferGeometry();
                const galaxyCount = 3000;
                const galaxyPositions = new Float32Array(galaxyCount * 3);
                const galaxyColors = new Float32Array(galaxyCount * 3);
                for (let i = 0; i < galaxyCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 700 + Math.random() * 300;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const y = (Math.random() - 0.5) * 30;
                    galaxyPositions[i*3] = x;
                    galaxyPositions[i*3+1] = y;
                    galaxyPositions[i*3+2] = z;
                    galaxyColors[i*3] = 0.8 + Math.random() * 0.2;
                    galaxyColors[i*3+1] = 0.8 + Math.random() * 0.2;
                    galaxyColors[i*3+2] = 1.0;
                }
                galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
                galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));
                const galaxyMaterial = new THREE.PointsMaterial({ size: 1.2, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
                const galaxy = new THREE.Points(galaxyGeometry, galaxyMaterial);
                scene.add(galaxy);
            }
            createStarField();

            // ==================== 通用工具 ====================
            const ORIGIN = new THREE.Vector3();
            const tmpVec = new THREE.Vector3();

            // 让物体沿 XZ 平面的圆形轨道移动（Y 保持不变）
            function applyOrbitXZ(obj, center, distance, angle) {
                obj.position.x = center.x + Math.cos(angle) * distance;
                obj.position.z = center.z + Math.sin(angle) * distance;
            }

            // 粒子系统通用更新：寿命耗尽则调用 respawn 重生，否则按速度位移
            function updateParticles(geometry, velocities, life, count, delta, decay, respawn) {
                const pos = geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    life[i] -= delta * decay;
                    if (life[i] <= 0) {
                        respawn(i, pos, velocities[i]);
                        life[i] = 1.0 + Math.random();
                    } else {
                        pos[i*3] += velocities[i].x * delta * speedFactor;
                        pos[i*3+1] += velocities[i].y * delta * speedFactor;
                        pos[i*3+2] += velocities[i].z * delta * speedFactor;
                    }
                }
                geometry.attributes.position.needsUpdate = true;
            }

            // ==================== 纹理工具 ====================
            function createCanvasTexture(width, height, drawFn) {
                const c = document.createElement('canvas');
                c.width = width;
                c.height = height;
                const ctx = c.getContext('2d');
                drawFn(ctx, width, height);
                const tex = new THREE.CanvasTexture(c);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            function generatePlanetTexture(type, baseColor) {
                return createCanvasTexture(256, 128, (ctx, w, h) => {
                    ctx.fillStyle = baseColor;
                    ctx.fillRect(0, 0, w, h);

                    if (type === 'earth') {
                        for (let i=0; i<60; i++) { const x=Math.random()*w; const y=Math.random()*h; ctx.fillStyle='#2d6a4f'; ctx.beginPath(); ctx.arc(x,y,5+Math.random()*20,0,Math.PI*2); ctx.fill(); }
                        for (let i=0; i<40; i++) { const x=Math.random()*w; const y=Math.random()*h; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(x,y,3+Math.random()*12,0,Math.PI*2); ctx.fill(); }
                    } else if (type === 'jupiter') {
                        const stripeColors = ['#d4a373','#e9c46a','#b5835a','#a8744a','#c29b6d','#d4b08c','#e5cfa5'];
                        const stripeHeight = 4;
                        for (let y=0; y<h; y+=stripeHeight) {
                            ctx.fillStyle = stripeColors[Math.floor(y/stripeHeight)%stripeColors.length];
                            ctx.fillRect(0, y, w, stripeHeight);
                        }
                        const spotX = w * 0.65;
                        const spotY = h * 0.45;
                        for (let i=0; i<8; i++) {
                            const offsetX = (Math.random() - 0.5) * 15;
                            const offsetY = (Math.random() - 0.5) * 8;
                            const radiusX = 6 + Math.random() * 12;
                            const radiusY = 2 + Math.random() * 5;
                            ctx.fillStyle = 'rgba(180, 80, 50, 0.3)';
                            ctx.beginPath();
                            ctx.ellipse(spotX + offsetX, spotY + offsetY, radiusX, radiusY, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (type === 'saturn') {
                        for (let y=0; y<h; y+=5) { ctx.fillStyle=['#f4e3c1','#e8d5a8','#d4b896','#c9ad7f'][Math.floor(y/5)%4]; ctx.fillRect(0,y,w,5); }
                        ctx.fillStyle = 'rgba(200,180,150,0.3)';
                        ctx.fillRect(0,0,w,10);
                        ctx.fillRect(0,h-10,w,10);
                    } else if (type === 'mars') {
                        for (let i=0; i<80; i++) { const x=Math.random()*w; const y=Math.random()*h; ctx.fillStyle=['#c1440e','#8b3a0f','#d46a4a'][Math.floor(Math.random()*3)]; ctx.beginPath(); ctx.arc(x,y,3+Math.random()*15,0,Math.PI*2); ctx.fill(); }
                        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h*0.1); ctx.fillRect(0,h*0.9,w,h*0.1);
                    } else if (type === 'mercury') {
                        for (let i=0; i<100; i++) { const x=Math.random()*w; const y=Math.random()*h; const r=1+Math.random()*6; ctx.fillStyle='rgba(100,100,100,0.5)'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
                    } else if (type === 'venus') {
                        for (let i=0; i<50; i++) { const x=Math.random()*w; const y=Math.random()*h; ctx.fillStyle='rgba(255,255,200,0.4)'; ctx.beginPath(); ctx.arc(x,y,5+Math.random()*20,0,Math.PI*2); ctx.fill(); }
                    } else if (type === 'uranus') {
                        for (let y=0; y<h; y+=4) { ctx.fillStyle=['#b0d4e8','#a0c8e0','#90bcd8','#80b0d0'][Math.floor(y/4)%4]; ctx.fillRect(0,y,w,4); }
                    } else if (type === 'neptune') {
                        for (let y=0; y<h; y+=6) { ctx.fillStyle=['#3366ff','#2a56d4','#2244aa','#1a3388'][Math.floor(y/6)%4]; ctx.fillRect(0,y,w,6); }
                        ctx.fillStyle='rgba(0,0,0,0.5)';
                        ctx.beginPath();
                        ctx.ellipse(w*0.3, h*0.4, 15, 8, 0, 0, Math.PI*2);
                        ctx.fill();
                    } else {
                        for (let i=0; i<30; i++) { const x=Math.random()*w; const y=Math.random()*h; ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(x,y,2+Math.random()*8,0,Math.PI*2); ctx.fill(); }
                    }
                });
            }

            // ==================== 太阳 ====================
            const sunGeometry = new THREE.SphereGeometry(3, 64, 64);
            const sunTexture = createCanvasTexture(512, 256, (ctx, w, h) => {
                const grad = ctx.createRadialGradient(w*0.5, h*0.5, 10, w*0.5, h*0.5, w*0.7);
                grad.addColorStop(0, '#fff5a0');
                grad.addColorStop(0.3, '#ffd700');
                grad.addColorStop(0.7, '#ff8c00');
                grad.addColorStop(1, '#e65100');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,w,h);
                for (let i=0; i<400; i++) {
                    const x = Math.random()*w;
                    const y = Math.random()*h;
                    const r = 2 + Math.random() * 12;
                    ctx.fillStyle = ['#ffcc00','#ff9900','#ff6600','#ff4400'][Math.floor(Math.random()*4)];
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI*2);
                    ctx.fill();
                }
                for (let i=0; i<15; i++) {
                    const x = Math.random()*w;
                    const y = Math.random()*h;
                    ctx.fillStyle = 'rgba(150,50,0,0.4)';
                    ctx.beginPath();
                    ctx.arc(x, y, 3+Math.random()*8, 0, Math.PI*2);
                    ctx.fill();
                }
            });
            const sunMaterial = new THREE.MeshStandardMaterial({ map: sunTexture, emissive: 0xffaa00, emissiveIntensity: 1.5, roughness: 0.4, metalness: 0 });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            // 光源就在太阳球心，若让太阳投射阴影，整个星系都会被它自己挡住
            scene.add(sun);

            // 加性辉光壳不写深度，否则会遮挡它背后的天体
            const glow1 = new THREE.Mesh(new THREE.SphereGeometry(3.4,32,32), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false }));
            scene.add(glow1);
            const glow2 = new THREE.Mesh(new THREE.SphereGeometry(3.8,32,32), new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false }));
            scene.add(glow2);

            // ==================== 太阳耀斑粒子 ====================
            const flareCount = 500;
            const flareParticles = new THREE.BufferGeometry();
            const flarePositions = new Float32Array(flareCount * 3);
            const flareVelocities = [];
            const flareLife = new Float32Array(flareCount);

            // 从太阳表面沿法线方向抛射
            function respawnFlare(i, pos, vel) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 3.1 + Math.random() * 0.5;
                pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i*3+2] = r * Math.cos(phi);
                tmpVec.set(pos[i*3], pos[i*3+1], pos[i*3+2]).normalize().multiplyScalar(0.3 + Math.random() * 0.8);
                vel.copy(tmpVec);
            }

            for (let i=0; i<flareCount; i++) {
                flareVelocities.push(new THREE.Vector3());
                respawnFlare(i, flarePositions, flareVelocities[i]);
                flareLife[i] = Math.random() * 2;
            }
            flareParticles.setAttribute('position', new THREE.BufferAttribute(flarePositions, 3));
            const flareMaterial = new THREE.PointsMaterial({ color: 0xffaa33, size: 0.06, sizeAttenuation: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }); // 粒子尺寸减小
            const flarePoints = new THREE.Points(flareParticles, flareMaterial);
            scene.add(flarePoints);

            // ==================== 行星数据 ====================
            const planetsData = [
                { name: '水星', radius: 0.4, distance: 6, color: '#aaaaaa', texture: 'mercury', speed: 4.15, rotationSpeed: 0.01, tilt: 0.034, info: { diameter: '4,879 km', mass: '3.301×10²³ kg', orbit: '87.97 天', rotation: '58.646 天', moons: '0' } },
                { name: '金星', radius: 0.6, distance: 9, color: '#ffcc88', texture: 'venus', speed: 1.62, rotationSpeed: 0.005, tilt: 2.64, info: { diameter: '12,104 km', mass: '4.867×10²⁴ kg', orbit: '224.7 天', rotation: '243 天（逆行）', moons: '0' } },
                { name: '地球', radius: 0.7, distance: 12, color: '#2288ff', texture: 'earth', speed: 1.0, rotationSpeed: 0.02, tilt: 0.41, info: { diameter: '12,742 km', mass: '5.972×10²⁴ kg', orbit: '365.25 天', rotation: '23.93 小时', moons: '1' } },
                { name: '火星', radius: 0.5, distance: 15, color: '#ff5533', texture: 'mars', speed: 0.53, rotationSpeed: 0.015, tilt: 0.44, info: { diameter: '6,779 km', mass: '6.417×10²³ kg', orbit: '687 天', rotation: '24.62 小时', moons: '2' } },
                { name: '木星', radius: 1.8, distance: 22, color: '#ddbb99', texture: 'jupiter', speed: 0.084, rotationSpeed: 0.03, tilt: 0.05, info: { diameter: '139,820 km', mass: '1.898×10²⁷ kg', orbit: '11.86 年', rotation: '9.93 小时', moons: '95' } },
                { name: '土星', radius: 1.5, distance: 28, color: '#eeddbb', texture: 'saturn', speed: 0.034, rotationSpeed: 0.025, tilt: 0.47, info: { diameter: '116,460 km', mass: '5.683×10²⁶ kg', orbit: '29.46 年', rotation: '10.7 小时', moons: '146' } },
                { name: '天王星', radius: 1.0, distance: 35, color: '#88ccff', texture: 'uranus', speed: 0.012, rotationSpeed: 0.02, tilt: 1.71, info: { diameter: '50,724 km', mass: '8.681×10²⁵ kg', orbit: '84.01 年', rotation: '17.24 小时（逆行）', moons: '27' } },
                { name: '海王星', radius: 0.9, distance: 42, color: '#3366ff', texture: 'neptune', speed: 0.006, rotationSpeed: 0.018, tilt: 0.49, info: { diameter: '49,244 km', mass: '1.024×10²⁶ kg', orbit: '164.8 年', rotation: '16.11 小时', moons: '14' } },
            ];

            const planets = [];
            const clickableObjects = [];

            clickableObjects.push({ mesh: sun, info: { name: '太阳', diameter: '1,392,700 km', mass: '1.989×10³⁰ kg', orbit: '约 2.25 亿年（绕银河系）', rotation: '约 25.05 天（赤道）', moons: '—', type: 'G型主序星' } });

            planetsData.forEach((data) => {
                const texture = generatePlanetTexture(data.texture, data.color);
                const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7, metalness: 0.1 });
                const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
                const planet = new THREE.Mesh(geometry, material);
                planet.castShadow = true;
                planet.receiveShadow = true;
                planet.userData = { distance: data.distance, speed: data.speed, rotationSpeed: data.rotationSpeed, angle: Math.random() * Math.PI * 2 };
                scene.add(planet);
                planets.push(planet);

                planet.rotation.x = data.tilt;

                if (data.name === '地球') {
                    const cloudGeo = new THREE.SphereGeometry(data.radius * 1.05, 32, 32);
                    const cloudTexture = createCanvasTexture(256, 128, (ctx, w, h) => {
                        ctx.fillStyle = 'rgba(0,0,0,0)';
                        ctx.fillRect(0, 0, w, h);
                        for (let i=0; i<60; i++) { const x=Math.random()*w; const y=Math.random()*h; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(x,y,2+Math.random()*10,0,Math.PI*2); ctx.fill(); }
                    });
                    const cloudMat = new THREE.MeshStandardMaterial({ map: cloudTexture, transparent: true, opacity: 0.6, roughness: 0.2, metalness: 0, depthWrite: false });
                    const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
                    cloudMesh.userData = { parent: planet, rotationSpeed: 0.025 };
                    planet.add(cloudMesh);
                }

                const orbitPoints = [];
                for (let i=0; i<=128; i++) {
                    const angle = (i/128)*Math.PI*2;
                    orbitPoints.push(new THREE.Vector3(Math.cos(angle)*data.distance, 0, Math.sin(angle)*data.distance));
                }
                const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
                const orbitMat = new THREE.LineBasicMaterial({ color: 0x556688, transparent: true, opacity: 0.3 });
                const orbitLine = new THREE.Line(orbitGeo, orbitMat);
                scene.add(orbitLine);

                clickableObjects.push({ mesh: planet, info: { name: data.name, diameter: data.info.diameter, mass: data.info.mass, orbit: data.info.orbit, rotation: data.info.rotation, moons: data.info.moons } });
            });

            // 按名称索引行星，避免依赖数组下标
            const planetByName = {};
            planets.forEach((planet, i) => { planetByName[planetsData[i].name] = planet; });
            const earth = planetByName['地球'];
            const jupiter = planetByName['木星'];
            const saturn = planetByName['土星'];
            const uranus = planetByName['天王星'];

            // ==================== 月球 ====================
            const moonGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const moonTexture = createCanvasTexture(128, 64, (ctx, w, h) => {
                ctx.fillStyle = '#cccccc'; ctx.fillRect(0,0,w,h);
                for (let i=0; i<30; i++) { const x=Math.random()*w; const y=Math.random()*h; ctx.fillStyle=['#aaaaaa','#bbbbbb','#999999'][Math.floor(Math.random()*3)]; ctx.beginPath(); ctx.arc(x,y,2+Math.random()*8,0,Math.PI*2); ctx.fill(); }
            });
            const moonMat = new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 0.8, metalness: 0 });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            moon.castShadow = true; moon.receiveShadow = true;
            scene.add(moon);
            const moonOrbitRadius = 1.5;
            const moonSpeed = 2.0;
            let moonAngle = 0;
            clickableObjects.push({ mesh: moon, info: { name: '月球', diameter: '3,474 km', mass: '7.342×10²² kg', orbit: '27.32 天', rotation: '27.32 天（潮汐锁定）', moons: '—' } });

            // ==================== 土星环（自然平衡） ====================
            const ringTexture = createCanvasTexture(1024, 64, (ctx, w, h) => {
                for (let x = 0; x < w; x++) {
                    const t = x / w;
                    let alpha = 0;
                    if (t < 0.2) {
                        alpha = 0.3 + 0.2 * Math.sin(t * 15);
                    } else if (t < 0.6) {
                        alpha = 0.55 + 0.25 * Math.sin((t - 0.2) * 12);
                    } else {
                        alpha = 0.4 + 0.2 * Math.sin((t - 0.6) * 18);
                    }
                    if (t > 0.50 && t < 0.54) alpha *= 0.15;
                    if (t > 0.72 && t < 0.75) alpha *= 0.3;
                    alpha = Math.min(0.8, Math.max(0.05, alpha));
                    const r = 210;
                    const g = 185;
                    const b = 150;
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    ctx.fillRect(x, 0, 1, h);
                }
            });

            const ringLayersConfig = [
                { inner: 1.8, outer: 2.4, opacity: 0.6 },
                { inner: 2.4, outer: 3.2, opacity: 0.75 },
                { inner: 3.2, outer: 3.8, opacity: 0.65 },
            ];

            // 整条环带纹理对应的半径范围
            const ringInner = ringLayersConfig[0].inner;
            const ringOuter = ringLayersConfig[ringLayersConfig.length - 1].outer;

            ringLayersConfig.forEach(config => {
                const ringGeo = new THREE.RingGeometry(config.inner, config.outer, 256);

                // RingGeometry 默认是平面投影 UV，纹理会横穿环面；改成径向 UV 才是同心环带
                const ringPos = ringGeo.attributes.position;
                const ringUv = ringGeo.attributes.uv;
                for (let i = 0; i < ringPos.count; i++) {
                    const r = Math.hypot(ringPos.getX(i), ringPos.getY(i));
                    ringUv.setXY(i, (r - ringInner) / (ringOuter - ringInner), 0.5);
                }

                const ringMat = new THREE.MeshStandardMaterial({
                    map: ringTexture,
                    side: THREE.DoubleSide,
                    roughness: 0.7,
                    metalness: 0.05,
                    transparent: true,
                    opacity: config.opacity,
                    depthWrite: false,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                saturn.add(ring);
            });

            // ==================== 天王星环 ====================
            const uranusRingGeo = new THREE.RingGeometry(1.2, 1.8, 64);
            const uranusRingMat = new THREE.MeshStandardMaterial({ color: 0x888888, side: THREE.DoubleSide, roughness: 0.7, metalness: 0, transparent: true, opacity: 0.4 });
            const uranusRing = new THREE.Mesh(uranusRingGeo, uranusRingMat);
            uranusRing.rotation.x = Math.PI / 2 + 0.3;
            uranus.add(uranusRing);

            // ==================== 木星卫星 ====================
            const galileanMoons = [
                { name: '伊奥', radius: 0.08, distance: 2.5, color: '#ffcc66', speed: 1.5 },
                { name: '欧罗巴', radius: 0.07, distance: 3.0, color: '#ccbb99', speed: 1.2 },
                { name: '盖尼米得', radius: 0.09, distance: 3.6, color: '#aaaaaa', speed: 0.9 },
                { name: '卡利斯托', radius: 0.08, distance: 4.2, color: '#888888', speed: 0.7 },
            ];
            const jupiterMoons = [];
            galileanMoons.forEach((moonData) => {
                const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(moonData.radius, 8, 8), new THREE.MeshStandardMaterial({ color: moonData.color, roughness: 0.7, metalness: 0 }));
                moonMesh.castShadow = true; moonMesh.receiveShadow = true;
                moonMesh.userData = { distance: moonData.distance, speed: moonData.speed, angle: Math.random() * Math.PI * 2 };
                scene.add(moonMesh);
                jupiterMoons.push(moonMesh);
            });

            // 泰坦
            const titan = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshStandardMaterial({ color: '#ccaa88', roughness: 0.7, metalness: 0 }));
            titan.castShadow = true; titan.receiveShadow = true;
            titan.userData = { distance: 2.0, speed: 0.5, angle: 0 };
            scene.add(titan);

            // ==================== 小行星带 ====================
            const asteroidGroup = new THREE.Group();
            const asteroidCount = 1000;
            const asteroidBeltDistanceMin = 17;
            const asteroidBeltDistanceMax = 20;
            for (let i=0; i<asteroidCount; i++) {
                const radius = 0.03 + Math.random() * 0.25;
                const geometry = new THREE.DodecahedronGeometry(radius, 0);
                const color = new THREE.Color().setHSL(0.05 + Math.random() * 0.1, 0.1, 0.4 + Math.random() * 0.3);
                const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.9, metalness: 0 });
                const asteroid = new THREE.Mesh(geometry, material);
                const angle = Math.random() * Math.PI * 2;
                const distance = asteroidBeltDistanceMin + Math.random() * (asteroidBeltDistanceMax - asteroidBeltDistanceMin);
                asteroid.position.set(Math.cos(angle) * distance, (Math.random()-0.5)*1.8, Math.sin(angle) * distance);
                asteroid.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                asteroid.userData = { distance: distance, speed: 0.04 + Math.random() * 0.03, angle: angle };
                asteroidGroup.add(asteroid);
            }
            scene.add(asteroidGroup);

            // 不可见热区，用于整片点击（优先级低于具体天体，见 handleClick）
            const asteroidBeltClickSphere = new THREE.Mesh(new THREE.SphereGeometry(19, 16, 16), new THREE.MeshBasicMaterial({ visible: false }));
            scene.add(asteroidBeltClickSphere);
            const asteroidBeltInfo = {
                name: '小行星带',
                diameter: '约 2.2–3.2 AU',
                mass: '约 3×10²¹ kg（总质量）',
                orbit: '约 3–6 年（平均）',
                rotation: '—',
                moons: '包含谷神星、灶神星等'
            };

            // ==================== 哈雷彗星 ====================
            const cometGroup = new THREE.Group();
            const comet = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0 }));
            comet.castShadow = true; comet.receiveShadow = true;
            cometGroup.add(comet);

            const cometClickSphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
            cometGroup.add(cometClickSphere);
            clickableObjects.push({
                mesh: cometClickSphere,
                info: { name: '哈雷彗星', diameter: '约 11 km（彗核）', mass: '约 2.2×10¹⁴ kg', orbit: '76 年', rotation: '约 2.2 天', moons: '—' }
            });

            const tailParticleCount = 300;
            const tailParticlesGeo = new THREE.BufferGeometry();
            const tailPositions = new Float32Array(tailParticleCount * 3);
            const tailVelocities = [];
            const tailLife = new Float32Array(tailParticleCount);
            for (let i = 0; i < tailParticleCount; i++) {
                tailPositions[i*3] = (Math.random() - 0.5) * 0.2;
                tailPositions[i*3+1] = (Math.random() - 0.5) * 0.2;
                tailPositions[i*3+2] = (Math.random() - 0.5) * 0.2;
                tailVelocities.push(new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1));
                tailLife[i] = Math.random() * 2;
            }
            tailParticlesGeo.setAttribute('position', new THREE.BufferAttribute(tailPositions, 3));
            const tailMaterial = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.06, sizeAttenuation: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
            const tailPoints = new THREE.Points(tailParticlesGeo, tailMaterial);
            cometGroup.add(tailPoints);
            scene.add(cometGroup);
            cometGroup.userData = { a: 60, b: 30, speed: 0.02, angle: 0 };

            // 彗尾粒子始终朝背离太阳的方向喷射
            const tailDirection = new THREE.Vector3();
            function respawnTail(i, pos, vel) {
                pos[i*3] = (Math.random() - 0.5) * 0.2;
                pos[i*3+1] = (Math.random() - 0.5) * 0.2;
                pos[i*3+2] = (Math.random() - 0.5) * 0.2;
                const spread = 0.5 + Math.random() * 1.5;
                vel.set(
                    tailDirection.x * spread + (Math.random() - 0.5) * 0.5,
                    tailDirection.y * spread + (Math.random() - 0.5) * 0.5,
                    tailDirection.z * spread + (Math.random() - 0.5) * 0.5
                );
            }

            // ==================== 速度滑条 ====================
            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            let speedFactor = parseFloat(speedSlider.value);
            speedSlider.addEventListener('input', (e) => {
                speedFactor = parseFloat(e.target.value);
                speedValue.textContent = speedFactor.toFixed(1) + 'x';
            });

            // ==================== 相机交互与点击检测 ====================
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let isMouseDown = false;
            let mouseDownPos = { x: 0, y: 0 };
            let lastMouseX = 0, lastMouseY = 0;
            let targetRotationY = 0, targetRotationX = 0.2, currentRotationY = 0, currentRotationX = 0.2;
            let targetZoom = 80, currentZoom = 80;

            canvas.addEventListener('mousedown', (e) => { isMouseDown = true; mouseDownPos.x = e.clientX; mouseDownPos.y = e.clientY; lastMouseX = e.clientX; lastMouseY = e.clientY; });
            window.addEventListener('mouseup', (e) => {
                if (!isMouseDown) return;
                isMouseDown = false;
                // 在画布外松手视为取消，避免操作 UI 时误触发点击
                if (e.target !== canvas) return;
                const dx = e.clientX - mouseDownPos.x;
                const dy = e.clientY - mouseDownPos.y;
                if (Math.abs(dx) < 5 && Math.abs(dy) < 5) handleClick(e);
            });
            window.addEventListener('blur', () => { isMouseDown = false; });
            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                targetRotationY -= deltaX * 0.005;
                targetRotationX += deltaY * 0.003;
                targetRotationX = Math.max(-1.2, Math.min(1.2, targetRotationX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            canvas.addEventListener('wheel', (e) => { e.preventDefault(); targetZoom = Math.max(15, Math.min(200, targetZoom + e.deltaY * 0.1)); }, { passive: false });

            const infoPanel = document.getElementById('infoPanel');
            const panelTitle = document.getElementById('panelTitle');
            const panelContent = document.getElementById('panelContent');
            const closePanelBtn = document.getElementById('closePanel');
            closePanelBtn.addEventListener('click', () => { infoPanel.style.display = 'none'; });

            // 命中天体则显示资料，否则关闭面板
            function handleClick(e) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                const hits = raycaster.intersectObjects(clickableObjects.map(obj => obj.mesh), false);
                const obj = hits.length > 0 && clickableObjects.find(o => o.mesh === hits[0].object);
                if (obj) { showInfo(obj.info); return; }

                // 热区半径 19 比内侧行星轨道更大，只能兜底检测，否则会抢走行星的点击
                if (raycaster.intersectObject(asteroidBeltClickSphere, false).length > 0) {
                    showInfo(asteroidBeltInfo);
                    return;
                }

                infoPanel.style.display = 'none';
            }

            function showInfo(info) {
                panelTitle.textContent = info.name;
                let html = '';
                if (info.diameter) html += `<div class="info-row"><span class="info-label">直径</span><span class="info-value">${info.diameter}</span></div>`;
                if (info.mass) html += `<div class="info-row"><span class="info-label">质量</span><span class="info-value">${info.mass}</span></div>`;
                if (info.orbit) html += `<div class="info-row"><span class="info-label">公转周期</span><span class="info-value">${info.orbit}</span></div>`;
                if (info.rotation) html += `<div class="info-row"><span class="info-label">自转周期</span><span class="info-value">${info.rotation}</span></div>`;
                if (info.moons) html += `<div class="info-row"><span class="info-label">卫星数量</span><span class="info-value">${info.moons}</span></div>`;
                if (info.type) html += `<div class="info-row"><span class="info-label">类型</span><span class="info-value">${info.type}</span></div>`;
                panelContent.innerHTML = html;
                infoPanel.style.display = 'block';
            }

            // ==================== 动画循环 ====================
            const clock = new THREE.Clock();

            function animate() {
                const delta = clock.getDelta();

                currentRotationY += (targetRotationY - currentRotationY) * 0.08;
                currentRotationX += (targetRotationX - currentRotationX) * 0.08;
                currentZoom += (targetZoom - currentZoom) * 0.08;
                const camX = Math.sin(currentRotationY) * currentZoom;
                const camZ = Math.cos(currentRotationY) * currentZoom;
                const camY = Math.sin(currentRotationX) * currentZoom * 0.6;
                camera.position.set(camX, camY, camZ);
                camera.lookAt(0, 0, 0);

                sun.rotation.y += 0.002;
                glow1.rotation.y += 0.001;
                glow2.rotation.y += 0.0015;

                updateParticles(flareParticles, flareVelocities, flareLife, flareCount, delta, 0.5, respawnFlare);

                planets.forEach(planet => {
                    const data = planet.userData;
                    data.angle += data.speed * delta * 0.5 * speedFactor;
                    applyOrbitXZ(planet, ORIGIN, data.distance, data.angle);
                    planet.rotation.y += data.rotationSpeed * delta * 10;
                    // 子物体（地球云层）以自身速度叠加自转
                    planet.children.forEach(child => {
                        if (child.userData.rotationSpeed) child.rotation.y += child.userData.rotationSpeed * delta * speedFactor;
                    });
                });

                moonAngle += moonSpeed * delta * speedFactor;
                applyOrbitXZ(moon, earth.position, moonOrbitRadius, moonAngle);
                moon.rotation.y += 0.01;

                jupiterMoons.forEach(moonMesh => {
                    const data = moonMesh.userData;
                    data.angle += data.speed * delta * speedFactor;
                    applyOrbitXZ(moonMesh, jupiter.position, data.distance, data.angle);
                });

                titan.userData.angle += titan.userData.speed * delta * speedFactor;
                applyOrbitXZ(titan, saturn.position, titan.userData.distance, titan.userData.angle);

                asteroidGroup.children.forEach(asteroid => {
                    const data = asteroid.userData;
                    data.angle += data.speed * delta * speedFactor;
                    applyOrbitXZ(asteroid, ORIGIN, data.distance, data.angle);
                });

                const cometOrbit = cometGroup.userData;
                cometOrbit.angle += cometOrbit.speed * delta * speedFactor;
                cometGroup.position.set(Math.cos(cometOrbit.angle) * cometOrbit.a, 0, Math.sin(cometOrbit.angle) * cometOrbit.b);
                tailDirection.copy(cometGroup.position).normalize();
                updateParticles(tailParticlesGeo, tailVelocities, tailLife, tailParticleCount, delta, 0.8, respawnTail);

                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
